<aside class="sidebar">
  <!-- Author Card -->
  <div class="sidebar-card author-card">
    <div class="author-avatar">
      <img src="{{ '/assets/images/avatar.jpg' | relative_url }}" alt="{{ site.author }}">
    </div>
    <h3 class="author-name">{{ site.author }}</h3>
    <p class="author-bio">{{ site.description }}</p>
    <div class="author-socials">
      {% if site.social.github and site.social.github != "" %}
      <a href="https://github.com/{{ site.social.github }}" aria-label="GitHub" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
      {% endif %}
      {% if site.social.twitter and site.social.twitter != "" %}
      <a href="https://twitter.com/{{ site.social.twitter }}" aria-label="Twitter/X" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      {% endif %}
      <a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
      </a>
    </div>
  </div>

  <!-- Article tags (at most 3) — matches post footer tags -->
  {% if page.tags.size > 0 %}
  <div class="sidebar-card">
    <h3 class="sidebar-title">标签</h3>
    <div class="tag-cloud">
      {% for tag in page.tags limit:3 %}
      <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}" class="tag">{{ tag }}</a>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</aside>
